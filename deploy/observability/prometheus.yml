global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["connectors:8080"]
        labels: { service: connectors }
      - targets: ["replay:8081"]
        labels: { service: replay }
      - targets: ["pipeline:8082"]
        labels: { service: pipeline }
      - targets: ["api:8083"]
        labels: { service: api }

  - job_name: cadvisor
    metric_relabel_configs:
      - source_labels: [image]
        regex: "(?:.*/)?([^/:@]+)(?:[:@].*)?"
        target_label: service
      - source_labels: [image]
        regex: ".*/pumpwatch-([^/:@]+)(?:[:@].*)?"
        target_label: service
      - source_labels: [service]
        regex: caddy
        target_label: service
        replacement: proxy
      - source_labels: [service]
        regex: blackbox-exporter
        target_label: service
        replacement: blackbox
      - regex: name
        action: labeldrop
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://proxy/"]
        labels: { check: "Home page" }
      - targets: ["http://proxy/api/v1/watchlist"]
        labels: { check: "Watchlist API" }
      - targets: ["http://proxy/api/v1/flags?limit=1"]
        labels: { check: "Flags API" }
      - targets: ["http://research:8090/healthz"]
        labels: { check: "Research service" }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
